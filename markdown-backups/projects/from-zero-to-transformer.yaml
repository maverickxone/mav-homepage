title: "从零开始学 Transformer"
slug: from-zero-to-transformer
order: 1
description: "从数学直觉到 Transformer 架构——每个算法从零手写一遍，再用框架跑一遍"
books:
  - slug: ai-math-foundations
    label: "Math"
    role: "数学底座：线代、微积分、概率、优化"
  - slug: ai-deep-learning-core
    label: "MLP"
    role: "MLP：感知机、反向传播、写一个 mini 框架"
  - slug: ai-computer-vision
    label: "CNN"
    role: "CNN：卷积、经典架构、图像分类"
  - slug: ai-nlp-foundations
    label: "NLP"
    role: "RNN：词嵌入、序列模型、注意力机制"
  - slug: ai-transformers
    label: "Transformer"
    role: "Transformer：Self-Attention → BERT → GPT"
transitions:
  - "向量运算和梯度是后面所有网络的语言。会了这些，就能开始搭第一个神经元。"
  - "MLP 只看到扁平的输入——但图像有空间结构。CNN 用卷积核来捕获局部模式。"
  - "CNN 解决了「空间」，但文本和时间序列有「顺序」。RNN 和 Attention 就是为序列而生的。"
  - "RNN 有长距离遗忘问题。Transformer 用 Self-Attention 一步到位看全局——这就是现代 LLM 的基础。"
sidebar:
  prerequisites:
    - "Python 基础"
    - "高中数学（函数、向量、求导）"
  concepts:
    - "线性代数与张量运算"
    - "梯度下降与自动求导"
    - "反向传播"
    - "激活函数与损失函数"
    - "卷积与特征提取"
    - "词嵌入 (Word2Vec, BPE)"
    - "RNN / LSTM / GRU"
    - "Seq2Seq + Attention"
    - "Self-Attention"
    - "Multi-Head Attention"
    - "Positional Encoding"
    - "BERT & GPT"
  outcomes:
    - "能从零手写反向传播和 Transformer"
    - "理解 Attention Is All You Need 每一个组件"
    - "具备继续学 LLM / 多模态的完整基础"
    - "能读懂主流深度学习论文的数学部分"
