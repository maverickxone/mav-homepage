title: "数字世界的底层格式"
slug: digital-formats
description: "文件、视频、网页——你每天接触的数字内容，底层到底长什么样"
books:
  - slug: pdf-explained
    role: "文档：PDF 这个你天天用的格式，内部结构出乎意料"
  - slug: video-screen
    role: "媒体：像素、编解码器、HDR 的技术全景"
  - slug: browser-war
    role: "渲染：浏览器怎么把代码变成你看到的页面"
transitions:
  - "PDF 是静态文档的终极格式，但现代内容越来越多是动态的——视频。从像素的物理呈现到编解码的数学压缩，逻辑是一脉相承的。"
  - "文件格式最终都要被「打开」和「渲染」。浏览器就是那个把 HTML、CSS、视频流全部变成像素的超级渲染引擎。"
sidebar:
  prerequisites:
    - "知道文件有扩展名这件事"
    - "用过 PDF 阅读器和视频播放器"
  concepts:
    - "PostScript 与页面描述语言"
    - "PDF 对象模型"
    - "字体嵌入与渲染"
    - "OCR 文字识别"
    - "像素与分辨率"
    - "色彩空间 (sRGB/DCI-P3)"
    - "视频编解码 (H.264/H.265/AV1)"
    - "码率与画质"
    - "HDR 与色深"
    - "刷新率与响应时间"
    - "浏览器渲染管线"
  outcomes:
    - "能解释 PDF 内部为什么长那样"
    - "理解 4K/HDR/120Hz 这些参数各自意味着什么"
    - "知道视频压缩的核心原理（帧间/帧内预测）"
    - "明白浏览器渲染和 PDF 渲染的本质区别"
