title: "深度学习从零到能读论文"
slug: deep-learning-path
description: "从 PyTorch 张量运算到 Transformer，一步步建立动手能力"
books:
  - slug: d2l-toolbox
    role: "前置：PyTorch 基础和自动求导"
  - slug: d2l-cnn
    role: "图像：卷积神经网络的完整链路"
  - slug: d2l-rnn
    role: "序列：从 RNN 到注意力机制"
transitions:
  - "张量运算和自动求导是所有神经网络的底座。有了这些工具之后，从最直觉的任务开始——让机器「看懂」图片。"
  - "CNN 处理的是空间信息，但现实世界还有时间维度：文本、语音、股价。RNN 系列就是为序列数据而生的。"
sidebar:
  prerequisites:
    - "Python 基础语法"
    - "线性代数直觉（矩阵乘法、向量）"
    - "微积分基础（导数、链式法则）"
  concepts:
    - "张量与自动求导"
    - "损失函数与优化器"
    - "卷积与特征提取"
    - "池化与下采样"
    - "Batch Normalization"
    - "数据增强"
    - "迁移学习"
    - "循环神经网络"
    - "LSTM / GRU"
    - "注意力机制"
    - "Seq2Seq"
    - "Transformer 基础"
  outcomes:
    - "能用 PyTorch 从零搭建 CNN 和 RNN"
    - "理解 ResNet、VGG 等经典架构为什么这样设计"
    - "能读懂 Attention Is All You Need 的核心思想"
    - "有能力自己跑实验、调超参、看 loss 曲线"
