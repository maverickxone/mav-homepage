title: "投资入门：从一股股票到一套认知"
author: "Mav"
description: "写给刚满 18 岁、第一次可以合法开户的大学生。九章回答一个问题：收益从哪里来？——股票是公司所有权的切片，债券是利息的凭证，黄金不下蛋，基金把选择题外包，而杠杆和骗局在收割没想清楚这个问题的人。以 SpaceX、OpenAI、苹果、茅台等真实公司为例，从上市与定价讲到一个大二学生的实操路线。"
language: "ZH-CN"
version: "1.0.0"
