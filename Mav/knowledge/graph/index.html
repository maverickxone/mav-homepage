<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识图谱 — Mav</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Inter", -apple-system, sans-serif; background: #fafafa; overflow: hidden; height: 100vh; width: 100vw; }
.topnav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  background: rgba(250,250,250,0.94); backdrop-filter: blur(10px);
  border-bottom: 1px solid #e5e5e5; height: 56px;
  display: flex; align-items: center; padding: 0 32px; justify-content: space-between;
}
.topnav a { color: #888; text-decoration: none; font-size: 14px; }
.topnav a:hover { color: #111; }
.topnav .brand { font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 600; color: #111; }
.topnav .nav-links { display: flex; gap: 24px; }
.topnav .nav-links .active { color: #111; font-weight: 500; }
.graph-header { position: fixed; top: 72px; left: 32px; z-index: 50; pointer-events: none; }
.graph-header h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.graph-header p { font-size: 13px; color: #888; }
.graph-header .stats { font-family: monospace; font-size: 11px; color: #aaa; margin-top: 6px; }
.graph-back { display: inline-block; margin-bottom: 10px; pointer-events: auto; font-family: monospace; font-size: 11px; color: #888; text-decoration: none; }
.graph-back:hover { color: #111; }
#graph-container { position: fixed; top: 56px; left: 0; width: 100vw; height: calc(100vh - 56px); }
.graph-tooltip {
  position: fixed; display: none; background: #fff; border: 1px solid #e5e5e5;
  padding: 16px 20px; max-width: 320px; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.1);
}
.graph-tooltip.visible { display: block; }
.graph-tooltip h3 { font-size: 15px; font-weight: 500; margin-bottom: 8px; color: #111; }
.graph-tooltip p { font-size: 13px; color: #555; line-height: 1.5; margin-bottom: 12px; }
.graph-tooltip .tt-meta { font-family: monospace; font-size: 10px; color: #aaa; margin-bottom: 8px; }
.graph-tooltip .tt-btn { display: inline-block; font-family: monospace; font-size: 11px; color: #111; border: 1px solid #e5e5e5; padding: 6px 14px; text-decoration: none; }
.graph-tooltip .tt-btn:hover { background: #111; color: #fff; border-color: #111; }
.graph-tooltip .tt-close { position: absolute; top: 8px; right: 12px; cursor: pointer; font-size: 18px; color: #aaa; background: none; border: none; }
.graph-tooltip .tt-close:hover { color: #111; }
.graph-hint { position: fixed; bottom: 24px; right: 32px; z-index: 50; font-family: monospace; font-size: 11px; color: #bbb; }
</style>
</head>
<body>
<nav class="topnav">
  <a class="brand" href="../../index.html">← Mav</a>
  <div class="nav-links">
    <a href="../../about/index.html">关于我</a>
    <a href="../index.html" class="active">知识库</a>
    <a href="../../blog/index.html">博客</a>
  </div>
</nav>
<div class="graph-header">
  <a href="../index.html" class="graph-back">← 返回知识库</a>
  <h1>知识图谱</h1>
  <p>滚轮缩放 · 拖拽平移 · 拖拽节点</p>
  <div class="stats" id="graph-stats"></div>
</div>
<div id="graph-container"></div>
<div class="graph-tooltip" id="tooltip"></div>
<div class="graph-hint">滚轮缩放 · 拖拽平移 · 拖拽节点</div>

<script src="https://cdn.jsdelivr.net/npm/force-graph/dist/force-graph.min.js"></script>
<script>
(async function() {
  const res = await fetch('graph-data.json');
  const raw = await res.json();

  document.getElementById('graph-stats').textContent =
    `${raw.books.length} 本书 · ${raw.chapters.length} 章 · ${raw.edges.length} 条关联`;

  // === Short labels ===
  const bookLabels = {
    'bite-to-byte-硬件篇': '硬件篇', 'blockchain-crypto': '区块链',
    'browser-war': '浏览器', 'claude-d2l-to-rnn': 'D2L讲义',
    'd2l-cnn': 'CNN', 'd2l-rnn': 'RNN', 'd2l-toolbox': 'DL工具箱',
    'euv-lithography': 'EUV光刻', 'git-guide': 'Git',
    'money-bank': '银行与货币', 'pdf-explained': 'PDF',
    'rust-book': 'Rust', 'server-frontend-backend': '服务器',
    'thermodynamics': '热力学', 'video-screen': '视频与屏幕'
  };

  // === Build graph data ===
  const nodes = [];
  const links = [];

  for (const book of raw.books) {
    nodes.push({
      id: book.id, nodeType: 'book',
      label: bookLabels[book.id] || book.title,
      fullTitle: book.title, description: book.description,
      url: book.url, chapterCount: book.chapterCount
    });
  }
  for (const ch of raw.chapters) {
    let label = ch.title.replace(/^第[一二三四五六七八九十\d]+[章部分]+[：:]?\s*/, '');
    if (label.length > 14) label = label.slice(0, 14) + '…';
    nodes.push({
      id: ch.id, nodeType: 'chapter', bookId: ch.bookId,
      label: label, fullTitle: ch.title,
      description: ch.description, url: ch.url
    });
    links.push({ source: ch.id, target: ch.bookId, edgeType: 'internal' });
  }
  for (const edge of raw.edges) {
    links.push({ source: edge.from, target: edge.to, edgeType: 'cross', label: edge.label });
  }

  // === State ===
  const tooltip = document.getElementById('tooltip');
  let hoveredNode = null;
  let draggedNode = null;

  // === Create graph ===
  const container = document.getElementById('graph-container');
  const Graph = ForceGraph()(container)
    .graphData({ nodes, links })
    .nodeId('id')
    .backgroundColor('#fafafa')
    .d3AlphaMin(0)
    .d3AlphaDecay(0.01)
    .d3VelocityDecay(0.2)
    .warmupTicks(150)
    .cooldownTicks(Infinity)
    .onNodeDragEnd(node => { node.fx = undefined; node.fy = undefined; draggedNode = null; hoveredNode = null; })
    .onNodeDrag(node => { draggedNode = node; hoveredNode = node; })
    .nodeCanvasObject((node, ctx, globalScale) => {
      const isBook = node.nodeType === 'book';
      const r = isBook ? 3 : 2;

      let alpha = 1;
      if (hoveredNode) {
        const hn = hoveredNode;
        if (hn.nodeType === 'book') {
          alpha = (node.id === hn.id || node.bookId === hn.id) ? 1 : 0.08;
        } else {
          const parentBook = hn.bookId;
          const isSameCluster = node.id === parentBook || node.bookId === parentBook;
          const isCrossConnected = links.some(l =>
            l.edgeType === 'cross' &&
            ((l.source.id === hn.id && l.target.id === node.id) ||
             (l.target.id === hn.id && l.source.id === node.id))
          );
          alpha = (isSameCluster || isCrossConnected) ? 1 : 0.08;
        }
      }

      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(node.x, node.y, r, 0, 2 * Math.PI);
      ctx.fillStyle = isBook ? '#444' : '#aaa';
      ctx.fill();

      if (isBook) {
        const fontSize = Math.max(10 / globalScale, 2.5);
        ctx.font = `500 ${fontSize}px "Inter", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#222';
        ctx.fillText(node.label, node.x, node.y + r + 2 / globalScale);
      } else if (globalScale > 1.5) {
        const fontSize = Math.max(8 / globalScale, 2);
        ctx.font = `400 ${fontSize}px "Inter", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#777';
        ctx.fillText(node.label, node.x, node.y + r + 2 / globalScale);
      }

      ctx.globalAlpha = 1;
    })
    .nodePointerAreaPaint((node, color, ctx) => {
      ctx.beginPath();
      ctx.arc(node.x, node.y, 8, 0, 2 * Math.PI);
      ctx.fillStyle = color;
      ctx.fill();
    })
    .linkCanvasObject((link, ctx, globalScale) => {
      const s = link.source, t = link.target;
      if (!s.x || !t.x) return;

      if (link.edgeType === 'internal') {
        let alpha = 0.15;
        if (hoveredNode) {
          const hn = hoveredNode;
          const parentBook = hn.nodeType === 'book' ? hn.id : hn.bookId;
          const isRelevant = (s.id === parentBook || t.id === parentBook);
          alpha = isRelevant ? 0.3 : 0.05;
        }
        ctx.beginPath();
        ctx.moveTo(s.x, s.y); ctx.lineTo(t.x, t.y);
        ctx.strokeStyle = `rgba(0,0,0,${alpha})`;
        ctx.lineWidth = 0.5 / globalScale;
        ctx.stroke();
      } else {
        let alpha = 0.1;
        let width = 0.5;
        if (hoveredNode) {
          if (s.id === hoveredNode.id || t.id === hoveredNode.id) {
            alpha = 0.6;
            width = 1.5;
          } else {
            alpha = 0.04;
          }
        }
        ctx.beginPath();
        ctx.moveTo(s.x, s.y); ctx.lineTo(t.x, t.y);
        ctx.strokeStyle = `rgba(80,80,80,${alpha})`;
        ctx.lineWidth = width / globalScale;
        ctx.stroke();
      }
    })
    .linkCanvasObjectMode(() => 'replace')
    .onNodeHover(node => {
      if (!draggedNode) hoveredNode = node;
      container.style.cursor = node ? 'pointer' : 'grab';
    })
    .onNodeClick((node, event) => {
      const isBook = node.nodeType === 'book';
      const meta = isBook ? `${node.chapterCount} 章` : (bookLabels[node.bookId] || '');
      tooltip.innerHTML = `
        <button class="tt-close" onclick="document.getElementById('tooltip').classList.remove('visible')">×</button>
        <div class="tt-meta">${meta}</div>
        <h3>${node.fullTitle}</h3>
        <p>${node.description || ''}</p>
        <a class="tt-btn" href="${node.url}">开始阅读 →</a>
      `;
      tooltip.style.left = Math.min(event.clientX + 16, window.innerWidth - 340) + 'px';
      tooltip.style.top = Math.max(event.clientY - 20, 70) + 'px';
      tooltip.classList.add('visible');
    })
    .onBackgroundClick(() => { tooltip.classList.remove('visible'); });

  Graph.d3Force('charge').strength(n => n.nodeType === 'book' ? -60 : -3);
  Graph.d3Force('link')
    .distance(l => l.edgeType === 'internal' ? 20 : 60)
    .strength(l => l.edgeType === 'internal' ? 1.2 : 0.2);
  Graph.d3Force('center').strength(0.8);
})();
</script>
</body>
</html>
