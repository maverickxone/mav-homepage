  <div class="note-tags">

  <div class="note-content">
    <h2 id="核心结论">核心结论</h2>
<p>DNS 查询通常一问一答、报文极小（&lt; 512 字节），UDP 无需三次握手，延迟最低。</p>
<h2 id="什么时候用-tcp">什么时候用 TCP</h2>
<ul>
<li>响应超过 512 字节（如 DNSSEC、大量记录）时，服务器置 TC 标志，客户端用 TCP 重试</li>
<li>区域传送（AXFR）直接走 TCP</li>
</ul>
<div class="callout">
<p class="callout-title">一句话版本</p>

<p>UDP 是默认快路径，TCP 是兜底大通道。</p>
</div>
