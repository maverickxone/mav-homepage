<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{chapter_title}} — {{book_title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" id="hljs-light" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link rel="stylesheet" id="hljs-dark" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="not all">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>

<div class="progress-bar" id="progress-bar"></div>

{{nav}}
{{settings_pop}}

<div class="with-sidebar">
  {{sidebar}}
  <article class="chapter-body">
    {{chapter_head}}
    {{content}}
    {{pager}}
  </article>
</div>

{{footer}}
{{search_overlay}}

<!-- Side Panel -->
<div class="side-panel" id="side-panel">
  <div class="side-panel-resize" id="side-panel-resize"></div>
  <div class="side-panel-header">
    <div class="side-panel-tabs">
      <button class="side-panel-tab active" data-mode="sidenote">补充</button>
      <button class="side-panel-tab" data-mode="notepad">笔记</button>
    </div>
    <button class="side-panel-close" aria-label="关闭">×</button>
  </div>
  <div class="side-panel-body"></div>
</div>
<button class="notepad-fab" id="notepad-fab" aria-label="便利贴">✎</button>

<!-- Mobile TOC -->
<button class="mtoc-fab" id="mtoc-fab" aria-label="目录">TOC</button>
<div class="mtoc-drawer" id="mtoc-drawer">
  <div class="mtoc-content"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
<script>mermaid.initialize({startOnLoad:true, theme:'neutral', fontFamily:'Inter, sans-serif'});</script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});"></script>
<script src="../assets/script.js"></script>
</body>
</html>
